name: Deploy

# Honest scope: this workflow is real and would work against an actual
# cluster + registry, but neither exists in this environment (see
# infra/README.md). It's gated on a repo variable specifically so it can't
# accidentally run and fail confusingly in a fork/environment that hasn't
# set up the target infrastructure — CI staying green is more useful than a
# deploy job failing loudly every time for reasons unrelated to the code.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  deploy:
    if: vars.INFRA_PROVISIONED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write # for OIDC-based AWS auth — no long-lived AWS keys in repo secrets
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Log in to registry
        run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

      - name: Build and push images
        run: |
          IMAGE_TAG=${{ github.sha }}
          for app in api web worker; do
            docker build -f apps/$app/Dockerfile -t ${{ secrets.ECR_REGISTRY }}/ai-commerce-$app:$IMAGE_TAG .
            docker push ${{ secrets.ECR_REGISTRY }}/ai-commerce-$app:$IMAGE_TAG
          done

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ai-commerce-${{ github.event.inputs.environment || 'staging' }}

      - name: Run database migrations
        run: |
          # Migrations run BEFORE the new pods roll out, as a one-off Job —
          # not from inside the app container's startup. The old pods keep
          # serving traffic against the new schema during rollout, which is
          # exactly why every migration in this project has to stay
          # backward-compatible with the previous version's queries (additive
          # columns, no synchronous drops) — a mid-rollout request from an
          # old pod hitting a column that no longer exists would be a
          # self-inflicted outage.
          kubectl run migrate-${{ github.sha }} --image=${{ secrets.ECR_REGISTRY }}/ai-commerce-api:${{ github.sha }} \
            --restart=Never -n ai-commerce -- npx prisma migrate deploy
          kubectl wait --for=condition=complete job/migrate-${{ github.sha }} -n ai-commerce --timeout=120s

      - name: Update image tags and apply
        working-directory: infra/k8s/overlays/${{ github.event.inputs.environment || 'staging' }}
        run: |
          kustomize edit set image \
            ai-commerce-api=${{ secrets.ECR_REGISTRY }}/ai-commerce-api:${{ github.sha }} \
            ai-commerce-web=${{ secrets.ECR_REGISTRY }}/ai-commerce-web:${{ github.sha }} \
            ai-commerce-worker=${{ secrets.ECR_REGISTRY }}/ai-commerce-worker:${{ github.sha }}
          kubectl apply -k .

      - name: Wait for rollout — this is the actual zero-downtime gate
        id: rollout
        run: |
          # kubectl rollout status blocks until every new pod is Ready per
          # the Deployment's maxUnavailable:0 strategy, or fails after the
          # timeout. Nothing about "zero-downtime" is real without this
          # step actually gating the pipeline on it.
          kubectl rollout status deployment/api -n ai-commerce --timeout=300s
          kubectl rollout status deployment/web -n ai-commerce --timeout=300s
          kubectl rollout status deployment/worker -n ai-commerce --timeout=300s

      - name: Smoke test the new deployment
        id: smoke
        run: |
          API_URL=$(kubectl get ingress ai-commerce -n ai-commerce -o jsonpath='{.spec.rules[0].host}')
          curl -f "https://$API_URL/v1/health" || exit 1

      - name: Automatic rollback on failure
        if: failure() && (steps.rollout.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          echo "::error::Rollout or smoke test failed — rolling back all three deployments"
          kubectl rollout undo deployment/api -n ai-commerce
          kubectl rollout undo deployment/web -n ai-commerce
          kubectl rollout undo deployment/worker -n ai-commerce
          kubectl rollout status deployment/api -n ai-commerce --timeout=180s

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce_ci
          POSTGRES_DB: ai_commerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U commerce"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://commerce:commerce_ci@localhost:5432/ai_commerce_test
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      JWT_ACCESS_SECRET: ci-only-secret-not-for-prod
      JWT_REFRESH_SECRET: ci-only-secret-not-for-prod-2
      S3_BUCKET: ci-bucket
      S3_ACCESS_KEY: ci-key
      S3_SECRET_KEY: ci-secret
      SSLCOMMERZ_STORE_ID: ci-store
      SSLCOMMERZ_STORE_PASSWORD: ci-password
      APP_BASE_URL: http://localhost:4000
      ANTHROPIC_API_KEY: ci-dummy-key
      VOYAGE_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install
        working-directory: apps/api
        run: npm ci
      - name: Prisma generate + migrate
        working-directory: apps/api
        run: npx prisma generate && npx prisma migrate deploy
      - name: Enable search + vector extensions
        working-directory: apps/api
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f scripts/enable-search.sql
          psql "$DATABASE_URL" -f scripts/enable-vector.sql
      - name: Dependency vulnerability scan
        working-directory: apps/api
        run: npm audit --audit-level=high || true
        # `|| true`: a hard fail here blocks every PR on any known advisory
        # in the tree, including ones with no fix released yet. CodeQL +
        # Dependabot (.github/dependabot.yml) are the enforcement layer;
        # this is a visibility check surfaced in the CI log.
      - name: Build
        working-directory: apps/api
        run: npm run build
      - name: Unit tests
        working-directory: apps/api
        run: npm test
      - name: Integration tests
        working-directory: apps/api
        run: npm run test:integration

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Component tests
        working-directory: apps/web
        run: npm test
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: apps/web
        run: npm run test:e2e
        env:
          CI: true
      - name: Lighthouse CI (performance/SEO/accessibility budgets)
        working-directory: apps/web
        run: npx lhci autorun
        continue-on-error: true # visibility check, not a merge blocker yet — see lighthouserc.js for why the perf threshold is set where it is

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - name: Install
        working-directory: apps/worker
        run: npm ci
      - name: Test
        working-directory: apps/worker
        run: npm test
      - name: Build
        working-directory: apps/worker
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [api, web, worker]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t ai-commerce-api:${{ github.sha }} .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t ai-commerce-web:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t ai-commerce-worker:${{ github.sha }} .
      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-commerce-api:${{ github.sha }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          exit-code: '0' # report, don't block — see rationale on the npm audit step above
      - name: Scan web image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-commerce-web:${{ github.sha }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Scan worker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-commerce-worker:${{ github.sha }}
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload API scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api
      - name: Upload web scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web
      - name: Upload worker scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-worker
      # Push to a registry here once one is provisioned (ECR/GHCR/Docker Hub).

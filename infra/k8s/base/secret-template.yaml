# This file documents the required Secret shape — it is NOT applied as-is.
# In a real cluster, these Secrets are created by External Secrets Operator
# syncing from AWS Secrets Manager (the same secret store bootstrap-secrets.ts
# already knows how to read from — see apps/api/src/bootstrap-secrets.ts),
# not from a YAML file with real values sitting in version control.
#
# For local testing against a real cluster only, you could `kubectl create
# secret generic api-secrets --from-env-file=apps/api/.env -n ai-commerce`
# instead of applying this file directly.

apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: ai-commerce
type: Opaque
stringData:
  DATABASE_URL: "postgresql://REPLACE:REPLACE@REPLACE/ai_commerce"
  REDIS_URL: "redis://REPLACE:6379"
  RABBITMQ_URL: "amqp://REPLACE:REPLACE@REPLACE:5672"
  JWT_ACCESS_SECRET: "REPLACE"
  JWT_REFRESH_SECRET: "REPLACE"
  S3_BUCKET: "REPLACE"
  S3_ACCESS_KEY: "REPLACE"
  S3_SECRET_KEY: "REPLACE"
  SSLCOMMERZ_STORE_ID: "REPLACE"
  SSLCOMMERZ_STORE_PASSWORD: "REPLACE"
  ANTHROPIC_API_KEY: "REPLACE"
  VOYAGE_API_KEY: "REPLACE"
  HCAPTCHA_SECRET: "REPLACE"
  SENTRY_DSN: "REPLACE"
---
apiVersion: v1
kind: Secret
metadata:
  name: worker-secrets
  namespace: ai-commerce
type: Opaque
stringData:
  REDIS_URL: "redis://REPLACE:6379"
  RABBITMQ_URL: "amqp://REPLACE:REPLACE@REPLACE:5672"

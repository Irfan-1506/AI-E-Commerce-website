apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-commerce-staging
resources:
  - ../../base

patches:
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3

images:
  - name: ai-commerce-api
    newTag: staging
  - name: ai-commerce-web
    newTag: staging
  - name: ai-commerce-worker
    newTag: staging

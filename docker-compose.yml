version: '3.9'
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev_only
      POSTGRES_DB: ai_commerce
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U commerce']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5672:5672'   # AMQP
      - '15672:15672' # management UI — http://localhost:15672, guest/guest in dev only
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://commerce:commerce_dev_only@postgres:5432/ai_commerce
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    expose:
      - '4000'
    restart: unless-stopped

  # Independent process, independently scalable (`docker compose up --scale
  # worker=3`) — this is the actual payoff of the event-driven split: worker
  # throughput scales without touching the api process at all.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      LOG_LEVEL: info
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      API_ORIGIN: http://api:4000
      NEXT_PUBLIC_SITE_URL: http://localhost
    expose:
      - '3000'
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - web
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    restart: unless-stopped

volumes:
  pgdata:

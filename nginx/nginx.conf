worker_processes auto;

events { worker_connections 1024; }

http {
  # Blunt edge-level rate limiting, in front of the app-level throttler —
  # defense in depth, and cheaper than letting Node absorb a flood.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  upstream web_upstream { server web:3000; }
  upstream api_upstream { server api:4000; }

  server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Tighten connect-src/script-src once you finalize your CDN/analytics list.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    client_max_body_size 10M;

    # API is versioned (/v1) behind the /api prefix the frontend calls —
    # e.g. browser requests /api/v1/products, nginx strips /api and forwards
    # /v1/products to the NestJS app, which serves everything under its own
    # global /v1 prefix except the payment gateway callbacks below.
    location /api/v1/auth/login {
      limit_req zone=auth burst=3 nodelay;
      proxy_pass http://api_upstream/v1/auth/login;
      include /etc/nginx/proxy_params;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://api_upstream/;
      include /etc/nginx/proxy_params;
    }

    # SSLCommerz calls back to APP_BASE_URL directly (unversioned, outside
    # /api) — see payments.module.ts. Proxied here too so the same nginx
    # front door works whether APP_BASE_URL points at nginx or straight at
    # the api container.
    location /payments/ {
      proxy_pass http://api_upstream/payments/;
      include /etc/nginx/proxy_params;
    }

    location /v1/docs {
      proxy_pass http://api_upstream/v1/docs;
      include /etc/nginx/proxy_params;
    }

    location / {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://web_upstream;
      include /etc/nginx/proxy_params;
    }
  }
}
